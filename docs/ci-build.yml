name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 版本要求来自 miuix 0.9.4：compileSdk 37 是它的 AAR 元数据强制要求，
      # 低于这个值 Gradle 会直接拒绝。这里显式装 37，避免 runner 自带版本不够。
      - name: Install compileSdk 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build library
        run: ./gradlew :library:assembleDebug --stacktrace

      - name: Build example
        run: ./gradlew :example:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: example-debug-apk
          path: example/build/outputs/apk/debug/*.apk
